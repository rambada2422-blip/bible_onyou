<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>고센의 두 심부름 · 혼자 하는 판</title>
<style>
:root{--bg:#fbf8f1;--fg:#2b2620;--card:#ffffff;--line:#e3dccd;--accent:#7a4e1d;--btn:#f3e7d3;--tag:#6b7a8f}
@media (prefers-color-scheme: dark){:root{--bg:#1d1b18;--fg:#efe8dc;--card:#2a2723;--line:#45403a;--accent:#e0b072;--btn:#3a332a;--tag:#a9b6c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:19px;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:17px;margin:0;color:var(--accent)}
.home{font-size:15px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px}
.num{font-size:14px;color:var(--tag);margin:0 0 4px}
h2{font-size:21px;margin:0 0 12px}
p{margin:0 0 12px}
.tag{display:inline-block;font-size:13px;color:var(--tag);border:1px solid var(--tag);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btns button{font-size:18px;text-align:left;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.end{margin-top:16px;font-weight:600;color:var(--accent)}
</style></head><body><main>
<header><h1>고센의 두 심부름 · 혼자 하는 판</h1><button class="home" id="home">처음으로</button></header>
<div class="card" id="card"></div>
</main>
<script>
const D={"1": {"name": "시작", "paras": ["<span class=\"tag\">탐험대 이야기</span> 지도 수첩을 펴요. 오늘은 혼자 하는 탐험이에요. 한 칸을 다 하면, 끝에 적힌 번호의 칸으로 가요.", "야곱의 온 가족이 가나안 땅을 떠나 애굽의 고센 땅에 와 있어요.", "<strong>첫 행동</strong>: 성경에서 창세기 46장 31절을 펴요. 요셉이 가족에게 할 일 두 가지를 말해요. 34절까지 읽어요.", "수첩의 고센 쪽에 적어요. 심부름 ① 가족이 왔다고 알리러 갈 사람은 누구인가요? 심부름 ② 하는 일을 물으면 대답할 사람들은 누구인가요? 요셉이 말한, 가족이 살 땅은 어디인가요?", "34절 끝의 애굽 사람들과 목축 이야기는 읽어도 되지만, 까닭은 성경이 자세히 말하지 않아요."], "btns": [{"to": "8", "label": "고센 쪽을 다 적었으면"}], "end": false}, "3": {"name": "● 쪽: 만나러 간 사람", "paras": ["창세기 47장 1절을 펴요. 요셉은 누구에게 갔나요? 46장 31절에서 요셉이 알리러 가겠다고 한 사람과 같은지도 봐요.", "<span class=\"tag\">탐험대 이야기</span> ● 쪽 맨 위와 수첩 겉의 ● 칸에 그 이름을 적어요. 만난 차례의 첫째 칸에는 &#x27;요셉&#x27;을 적어요.", "아버지와 형들이 와 있다는 것을, 요셉이 그 사람에게 알렸어요. 첫째 심부름이에요."], "btns": [{"to": "5", "label": "다 적었으면"}], "end": false}, "4": {"name": "고르기: 먹을 것", "paras": ["먹을 것도 요셉이 가족에게 주었어요.", "이번에는 성경을 덮고 먼저 골라요. 요셉은 먹을 것을 무엇에 맞춰 주었을까요?"], "btns": [{"to": "15", "label": "가축 수에 맞춰"}, {"to": "10", "label": "식구 수에 맞춰"}], "end": false}, "5": {"name": "고르기: 형은 몇 명", "paras": ["다음에는 요셉이 형들을 바로 앞에 데려갔어요. 형들 가운데 몇 사람만 골라서요.", "이번에는 성경을 덮고 먼저 골라요. 바로 앞에 간 형은 몇 명이었을까요?"], "btns": [{"to": "12", "label": "열 명"}, {"to": "7", "label": "다섯 명"}], "end": false}, "7": {"name": "형 다섯 명과 둘째 심부름", "paras": ["창세기 47장 2절을 펴서, 바로 앞에 간 형의 수를 확인해요. 만난 차례의 둘째 칸에 &#x27;형 (　) 명&#x27;을 적어요. 수첩 겉의 ● 칸 아래에도 그 수를 적어요.", "47장 3절을 읽어요. 형들에게 바로가 무엇을 물었나요?", "형들은 자기들 말고 또 누가 그 일을 했다고 대답했나요? 46장 34절 요셉의 말에도 같은 낱말이 있어요. 형들의 대답 칸에 적어요. (&#x27;우리&#x27;나 &#x27;종들&#x27;도 두 곳에 다 있지만, 사람을 가리키는 낱말을 찾아요.)", "47장 7절을 읽어요. 마지막으로 바로 앞에 선 사람은 누구인가요? 만난 차례의 셋째 칸에 적어요."], "btns": [{"to": "9", "label": "다 적었으면"}], "end": false}, "8": {"name": "고센 쪽 확인", "paras": ["내 답과 견줘 봐요. 심부름 ①은 요셉이에요. 심부름 ②는 형들이에요(&#x27;형들과 아버지의 가족&#x27;도 맞아요). 요셉이 말한 땅은 고센이에요(46장 34절).", "다른 곳이 있으면 46장 31–34절을 다시 읽고 고쳐요.", "이제 먼저 풀 물음을 하나 골라요. 맞고 틀림은 없어요."], "btns": [{"to": "3", "label": "누구를 만나러 갔나?"}, {"to": "11", "label": "무엇을 받았나?"}], "end": false}, "9": {"name": "● 쪽 확인", "paras": ["내 답과 견줘 봐요. 요셉이 간 사람은 바로예요(47장 1절). 만난 차례는 요셉 → 형 다섯 명 → 아버지 야곱이에요(47장 1, 2, 7절). 바로가 물은 것은 생업, 곧 하는 일이에요(47장 3절). 같은 낱말은 &#x27;선조&#x27;예요(46장 34절, 47장 3절).", "다른 곳이 있으면 그 절을 다시 읽고 고쳐요.", "<span class=\"tag\">탐험대 이야기</span> 일지에 적어요. ● 바로를 만난 차례(창세기 47장 1, 2, 7절), 두 심부름(창세기 46장 31–34절, 47장 1–3절), 다른 때 칸을 다녀왔으면 곡식을 사러 온 날(창세기 42장 3, 6절).", "▲ 쪽을 아직 안 했으면 지금 할 수도 있고, 다음에 해도 돼요."], "btns": [{"to": "11", "label": "▲ 쪽을 지금 한다"}, {"to": "16", "label": "오늘은 여기까지"}], "end": false}, "10": {"name": "먹을 것 확인하기", "paras": ["창세기 47장 12절을 펴요. 라암셋이 나온 절 바로 다음이에요.", "요셉은 먹을 것을 무엇에 맞춰 주었나요? ▲ 쪽 &#x27;먹을 것&#x27; 칸에 적어요."], "btns": [{"to": "13", "label": "다 적었으면"}], "end": false}, "11": {"name": "▲ 쪽: 받은 땅", "paras": ["창세기 47장 11절을 펴요. 요셉이 가족에게 준 땅의 이름은 무엇인가요?", "<span class=\"tag\">탐험대 이야기</span> ▲ 쪽 맨 위와 수첩 겉의 ▲ 칸에 그 이름을 적어요. 받은 것의 살 곳 칸에도 적어요.", "&#x27;고센&#x27;이 떠올랐나요? 고센은 47장 6절에서 바로가 말한 땅이에요. 요셉이 준 곳을 적은 11절에는 다른 이름이 나와요. 성경은 여기서 두 이름이 어떤 사이인지 말하지 않아요.", "47장 6절을 읽어요. 고센 쪽에 적은 땅 이름이 바로의 말에도 나오나요? ▲ 쪽 확인 칸에 &#x27;나온다&#x27; 또는 &#x27;안 나온다&#x27;를 적어요."], "btns": [{"to": "4", "label": "다 적었으면"}], "end": false}, "12": {"name": "다른 때: 곡식을 사러 온 날", "paras": ["<span class=\"tag\">탐험대 이야기</span> 다른 때로 가 봐요. 형들이 처음 곡식을 사러 애굽에 온 날이에요.", "창세기 42장 6절을 펴요. 형들이 그 앞에 엎드린 사람은 누구인가요? ● 쪽 맨 위에 적은 사람과 같은가요?", "42장 3절도 읽어요. 이날 곡식을 사러 온 형은 몇 명이었나요?", "열 명은 곡식을 사러 온 날의 형들이에요. 바로 앞에 간 형의 수는 47장에 있어요."], "btns": [{"to": "5", "label": "다시 고르러 (칸 5)"}], "end": false}, "13": {"name": "▲ 쪽 확인", "paras": ["내 답과 견줘 봐요. 요셉이 준 땅은 라암셋이에요(47장 11절). 고센은 바로의 말에도 나와요(47장 6절). 먹을 것은 식구 수대로 주었어요(47장 12절).", "다른 곳이 있으면 그 절을 다시 읽고 고쳐요.", "<span class=\"tag\">탐험대 이야기</span> 일지에 적어요. ▲ 가족이 받은 것(창세기 47장 11–12절), 요셉이 말한 땅과 바로의 말(창세기 46장 34절, 47장 6절), 다른 때 칸을 다녀왔으면 돈이 떨어진 때(창세기 47장 15–17절).", "● 쪽을 아직 안 했으면 지금 할 수도 있고, 다음에 해도 돼요."], "btns": [{"to": "3", "label": "● 쪽을 지금 한다"}, {"to": "16", "label": "오늘은 여기까지"}], "end": false}, "15": {"name": "다른 때: 돈이 떨어진 때", "paras": ["<span class=\"tag\">탐험대 이야기</span> 다른 때로 가 봐요. 흉년이 더 심해져 돈이 떨어진 때예요.", "창세기 47장 13–17절을 펴요. 돈이 떨어져 요셉에게 온 사람들은 누구인가요? ▲ 쪽에서 먹을 것을 받은 사람들과 같은가요?", "가축과 바꾸어 먹을 것을 받은 일은 애굽 백성에게 있었던 일이에요. 18절부터의 일은 이 판에서 읽지 않아도 돼요."], "btns": [{"to": "4", "label": "다시 고르러 (칸 4)"}], "end": false}, "16": {"name": "수첩 닫기", "paras": ["<span class=\"tag\">탐험대 이야기</span> 수첩 겉의 지도를 봐요. 빈칸을 몇 개 채웠나요? 남은 빈칸이 있으면, 다음에 칸 8에서 남은 물음을 골라 그 쪽을 열어요.", "(원하면) 한 문장 기도: 우리 가족에게 살 곳과 먹을 것을 주시는 하나님, 고맙습니다."], "btns": [], "end": true}};
const FIRST="1";
function show(n){
  const s=D[n]; const c=document.getElementById('card');
  let h='<p class="num">칸 '+n+'</p><h2>'+s.name+'</h2>';
  s.paras.forEach(p=>{h+='<p>'+p+'</p>';});
  if(s.btns.length){h+='<div class="btns">';s.btns.forEach(b=>{h+='<button data-to="'+b.to+'">'+b.label+' → 칸 '+b.to+'</button>';});h+='</div>';}
  if(s.end){h+='<p class="end">끝. 수고했어요.</p>';}
  c.innerHTML=h; c.dataset.cur=n; window.scrollTo(0,0);
  c.querySelectorAll('button[data-to]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.to)));
}
document.getElementById('home').addEventListener('click',()=>show(FIRST));
show(FIRST);
</script></body></html>

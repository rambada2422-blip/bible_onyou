<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>고센의 두 심부름 · 혼자 하는 판</title>
<style>
:root{--bg:#fbf8f1;--fg:#2b2620;--card:#ffffff;--line:#e3dccd;--accent:#7a4e1d;--btn:#f3e7d3;--tag:#6b7a8f}
@media (prefers-color-scheme: dark){:root{--bg:#1d1b18;--fg:#efe8dc;--card:#2a2723;--line:#45403a;--accent:#e0b072;--btn:#3a332a;--tag:#a9b6c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:19px;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:17px;margin:0;color:var(--accent)}
.home{font-size:15px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px}
.num{font-size:14px;color:var(--tag);margin:0 0 4px}
h2{font-size:21px;margin:0 0 12px}
p{margin:0 0 12px}
.tag{display:inline-block;font-size:13px;color:var(--tag);border:1px solid var(--tag);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btns button{font-size:18px;text-align:left;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.end{margin-top:16px;font-weight:600;color:var(--accent)}
</style></head><body><main>
<header><h1>고센의 두 심부름 · 혼자 하는 판</h1><span><button class="home" id="nb">수첩 모양</button> <button class="home" id="home">처음으로</button></span></header>
<div class="card" id="card"></div>
</main>
<script>
const D={"1": {"name": "시작", "paras": ["<span class=\"tag\">탐험대 이야기</span> 오늘은 혼자 하는 탐험이에요. 지도 수첩이 없으면, 위의 &#x27;수첩 모양&#x27;을 보고 종이에 그려요.", "<strong>첫 행동</strong>: 성경에서 창세기 46장 31절을 펴서, 34절까지 읽어요."], "btns": [{"to": "1나", "label": "다 읽었으면"}], "end": false}, "1나": {"name": "고센 쪽 채우기", "paras": ["요셉이 가족에게 할 일 두 가지를 말했어요. <span class=\"tag\">탐험대 이야기</span> 이 판에서는 그 두 가지를 &#x27;심부름&#x27;이라고 불러요.", "<span class=\"tag\">탐험대 이야기</span> 수첩의 고센 쪽에 적어요. 심부름 ①을 할 사람, 심부름 ②를 할 사람들, 요셉이 말한 가족이 살 땅이에요."], "btns": [{"to": "8", "label": "고센 쪽을 다 적었으면"}], "end": false}, "3": {"name": "● 쪽: 먼저 고르기", "paras": ["47장에서 요셉은 두 심부름을 하러 가요. 형들 가운데 몇 사람만 골라 데려가요.", "47장을 펴기 전에 먼저 골라요. 데려간 형은 몇 명이었을까요?"], "btns": [{"to": "12", "label": "열 명"}, {"to": "7", "label": "다섯 명"}], "end": false}, "7": {"name": "47장 처음 읽기", "paras": ["<span class=\"tag\">탐험대 이야기</span> 이제 47장을 펴요. 1절에서 요셉은 누구에게 갔나요? 46장 31절의 사람과 같은지도 봐요.", "<span class=\"tag\">탐험대 이야기</span> ● 쪽 맨 위, 겉의 ● 칸, 만난 차례의 첫째 칸(요셉)을 채워요."], "btns": [{"to": "7나", "label": "다 적었으면"}], "end": false}, "7나": {"name": "형들과 바로의 물음", "paras": ["47장 2절에서, 그 앞에 간 형의 수를 확인해요. <span class=\"tag\">탐험대 이야기</span> 만난 차례의 둘째 칸과 겉의 ● 칸 옆에 적어요.", "3절에서, 형들에게 바로가 무엇을 물었는지 찾아 &#x27;바로의 물음&#x27;에 적어요. (&#x27;생업&#x27;은 하는 일이에요.)"], "btns": [{"to": "7다", "label": "다 적었으면"}], "end": false}, "7다": {"name": "형들의 대답과 마지막 사람", "paras": ["3절에서, 형들은 자기들 말고 또 누가 그 일을 했다고 대답했나요? 46장 34절 요셉의 말에도 같은 낱말이 있어요.", "&#x27;우리&#x27;와 &#x27;종들&#x27;은 형들 자신이니, 자기들 말고 그 일을 한 사람을 찾아 적어요.", "7절에서, 마지막으로 바로 앞에 선 사람을 찾아 만난 차례의 셋째 칸에 적어요."], "btns": [{"to": "9", "label": "다 적었으면"}], "end": false}, "8": {"name": "고센 쪽 확인", "paras": ["내 답과 견줘 봐요. ①은 요셉, ②는 형들이에요(형들과 아버지의 가족도 맞아요).", "&#x27;당신들&#x27;이라고 적었다면 31절에서 요셉이 누구에게 말했는지 봐요. 가족이 살 땅은 고센이에요(46장 34절)."], "btns": [{"to": "8나", "label": "다른 곳은 다시 읽고 고쳐요."}], "end": false}, "8나": {"name": "먼저 풀 물음 고르기", "paras": ["이제 먼저 풀 물음을 하나 골라요. 맞고 틀림은 없어요."], "btns": [{"to": "3", "label": "누구를 만나러 갔나?"}, {"to": "11", "label": "무엇을 받았나?"}], "end": false}, "9": {"name": "● 쪽 확인", "paras": ["내 답과 견줘 봐요. 요셉이 간 사람은 바로예요(47장 1절). 만난 차례는 요셉 → 형 다섯 명 → 아버지 야곱이에요(47장 1, 2, 7절)."], "btns": [{"to": "9나", "label": "다른 곳은 다시 읽고 고쳐요."}], "end": false}, "9나": {"name": "● 쪽 확인 (이어서)", "paras": ["바로가 물은 것은 생업, 곧 하는 일이에요(3절). 형들이 말한 사람은 &#x27;선조&#x27;예요(46장 34절, 47장 3절).", "&#x27;우리&#x27;, &#x27;종들&#x27;은 형들 자신이라 답이 아니에요."], "btns": [{"to": "9다", "label": "다른 곳은 다시 읽고 고쳐요."}], "end": false}, "9다": {"name": "● 쪽 마무리", "paras": ["칸 12를 다녀왔다면, 형들이 엎드린 사람은 요셉이고 그날 온 형은 열 명이에요(42장 3, 6절). 바로 앞에 간 다섯 명과 다른 날이에요.", "<span class=\"tag\">탐험대 이야기</span> 일지에 적어요. &#x27;바로를 만난 차례 · 47장 1, 2, 7절 · 요셉 → 형 다섯 명 → 아버지 야곱&#x27;."], "btns": [{"to": "11", "label": "▲ 쪽도 지금 해요"}, {"to": "16", "label": "두 쪽을 다 했거나, 오늘은 여기까지"}], "end": false}, "10": {"name": "47장 11–12절 읽기", "paras": ["<span class=\"tag\">탐험대 이야기</span> 이제 47장을 펴요. 11절에서 요셉이 가족에게 준 땅의 이름을 찾아, ▲ 쪽 맨 위와 겉의 ▲ 칸, 받은 것의 살 곳에 적어요.", "바로 다음 12절에서, 먹을 것을 무엇에 맞춰 주었는지 찾아 받은 것의 먹을 것에 적어요."], "btns": [{"to": "10나", "label": "다 적었으면"}], "end": false}, "10나": {"name": "바로의 말", "paras": ["47장 6절을 읽어요. 고센 쪽에 적은 땅 이름이 바로의 말에도 나오나요?", "<span class=\"tag\">탐험대 이야기</span> ▲ 쪽 확인 칸에 &#x27;나온다&#x27; 또는 &#x27;안 나온다&#x27;를 적어요."], "btns": [{"to": "13", "label": "다 적었으면"}], "end": false}, "11": {"name": "▲ 쪽: 먼저 고르기", "paras": ["<span class=\"tag\">탐험대 이야기</span> ▲ 쪽은 &#x27;무엇을 받았나&#x27;예요. 요셉은 가족에게 먹을 것도 주었어요.", "47장을 펴기 전에 먼저 골라요. 먹을 것은 무엇에 맞춰 주었을까요?"], "btns": [{"to": "15", "label": "가축 수에 맞춰"}, {"to": "10", "label": "식구 수에 맞춰"}], "end": false}, "12": {"name": "다른 때: 곡식을 사러 온 날", "paras": ["<span class=\"tag\">탐험대 이야기</span> 다른 때로 가 봐요. 형들이 처음 곡식을 사러 애굽에 온 날이에요.", "42장 6절: 형들이 그 앞에 엎드린 사람은 누구인가요? 42장 3절: 이날 온 형은 몇 명인가요?"], "btns": [{"to": "3", "label": "찾았으면, 다시 고르러"}], "end": false}, "13": {"name": "▲ 쪽 확인", "paras": ["내 답과 견줘 봐요. 요셉이 준 땅은 라암셋이에요(47장 11절). 먹을 것은 식구 수대로 주었어요(12절). 고센은 바로의 말에도 나와요(6절)."], "btns": [{"to": "13나", "label": "다른 곳은 다시 읽고 고쳐요."}], "end": false}, "13나": {"name": "▲ 쪽 확인 (이어서)", "paras": ["고센과 라암셋이 어떤 사이인지 이곳에서 성경은 말하지 않아요. 같은 장 27절에는 가족이 고센 땅에 살았다고 적혀 있어요.", "칸 15를 다녀왔다면, 가축을 끌고 온 사람들은 애굽 백성이에요(47장 15–17절). 요셉의 가족과 다른 사람들이에요."], "btns": [{"to": "13다", "label": "다 읽었으면"}], "end": false}, "13다": {"name": "▲ 쪽 마무리", "paras": ["<span class=\"tag\">탐험대 이야기</span> 일지에 적어요. &#x27;가족이 받은 것 · 47장 11–12절 · 살 곳 라암셋 땅, 먹을 것 식구 수대로&#x27;."], "btns": [{"to": "3", "label": "● 쪽도 지금 해요"}, {"to": "16", "label": "두 쪽을 다 했거나, 오늘은 여기까지"}], "end": false}, "15": {"name": "다른 때: 돈이 떨어진 때", "paras": ["<span class=\"tag\">탐험대 이야기</span> 다른 때로 가 봐요. 흉년이 더 심해져 돈이 떨어진 때예요.", "47장 15–17절에서, 돈이 떨어져 요셉에게 온 사람들을 찾아봐요. 18절부터는 읽지 않아도 돼요."], "btns": [{"to": "11", "label": "찾았으면, 다시 고르러"}], "end": false}, "16": {"name": "수첩 닫기", "paras": ["<span class=\"tag\">탐험대 이야기</span> 수첩 겉의 지도를 봐요. 빈칸을 몇 개 채웠나요? 남은 빈칸이 있으면, 다음에 칸 8나에서 남은 물음을 골라요.", "(원하면) 한 문장 기도: 우리 가족에게 살 곳과 먹을 것을 주시는 하나님, 고맙습니다."], "btns": [], "end": true}};
const FIRST="1";
const NB="<p><span class=\"tag\">탐험대 이야기</span> <strong>겉 면</strong>: 가나안 땅 → 고센 땅 · ● (　　　) 앞, 그 앞에 선 형 (　) 명 · ▲ (　　　) 땅 · 칸의 자리는 실제 거리나 방향이 아니에요.</p><p><strong>고센 쪽 · 창세기 46장</strong>: 심부름 ① 가족이 왔다고 알리러 갈 사람 (　　) · 심부름 ② 하는 일을 물으면 대답할 사람들 (　　) · 요셉이 말한, 가족이 살 땅 (　　) 땅</p><p><strong>● 쪽 · 창세기 47장</strong>: (　　　) 앞 · 만난 차례: 첫째 (　　) → 둘째 (　　) → 셋째 (　　) · 바로의 물음 (　　) · 형들의 대답에서, 자기들 말고 그 일을 했다는 사람 (　　)</p><p><strong>▲ 쪽 · 창세기 47장</strong>: (　　　) 땅 · 받은 것: 살 곳 (　　), 먹을 것 (　　) · 확인: 고센 쪽에 적은 땅 이름이 바로의 말에도 나오나요? (나온다 / 안 나온다)</p>";
function show(n){
  const s=D[n]; const c=document.getElementById('card');
  let h='<p class="num">칸 '+n+'</p><h2>'+s.name+'</h2>';
  s.paras.forEach(p=>{h+='<p>'+p+'</p>';});
  if(s.btns.length){h+='<div class="btns">';s.btns.forEach(b=>{h+='<button data-to="'+b.to+'">'+b.label+' → 칸 '+b.to+'</button>';});h+='</div>';}
  if(s.end){h+='<p class="end">끝. 수고했어요.</p>';}
  c.innerHTML=h; c.dataset.cur=n; window.scrollTo(0,0);
  c.querySelectorAll('button[data-to]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.to)));
}
document.getElementById('home').addEventListener('click',()=>show(FIRST));
document.getElementById('nb').addEventListener('click',()=>{const c=document.getElementById('card');const back=c.dataset.cur;c.innerHTML='<p class="num">수첩 빈칸 (답 없음)</p><h2>종이에 옮겨 그려요</h2>'+NB+'<div class="btns"><button id="back">하던 칸으로 돌아가기</button></div>';document.getElementById('back').addEventListener('click',()=>show(back));});
show(FIRST);
</script></body></html>

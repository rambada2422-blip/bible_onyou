<style>:root { color-scheme: light; --ink:#223e35; --paper:#fffdf6; --line:#cecbb9; --teal:#245346; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:#efefe5; font:16px/1.65 system-ui,sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
main { width:min(100%,47rem); margin:auto; padding:0 clamp(12px,3vw,26px) 32px; }
header,.head,.actions,.progress-label { display:flex; align-items:center; justify-content:space-between; gap:10px; }
header { padding:15px 2px; border-bottom:1px solid #9da99b; } header b { padding-left:8px; } header small,.muted { color:#4a6254; }
h1,h2,h3,p,figure,fieldset { margin:0; } h1,h2,.line { font-family:Georgia,"Noto Serif KR",serif; line-height:1.48; letter-spacing:-.035em; }
h1 { font-size:clamp(28px,6vw,39px); } h2 { font-size:25px; } h3 { font-size:16px; } p+p { margin-top:8px; }
.page { margin-top:14px; padding:clamp(16px,4vw,30px); background:var(--paper); border:1px solid var(--line); border-radius:13px; }
.cover { display:block; width:100%; max-height:235px; object-fit:cover; border-radius:7px; margin-bottom:13px; }
small,.progress-label { font-size:14px; } .stage { color:#71623a; font-weight:700; } .line { font-size:clamp(22px,4.5vw,30px); min-height:4.2em; margin:14px 0 18px; }
progress { height:6px; width:100%; accent-color:var(--teal); display:block; margin:10px 0 18px; }
button,input { font:inherit; } button,summary { cursor:pointer; } button { min-height:44px; padding:8px 15px; border:1px solid #aeb9a8; border-radius:7px; background:#f7f6ed; color:var(--ink); }
button.primary { background:var(--teal); color:white; border-color:var(--teal); font-weight:700; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline:3px solid #a4591c; outline-offset:2px; }
.actions { flex-wrap:wrap; margin-top:18px; } .actions>.primary { margin-left:auto; }
.role { color:#69562e; font-weight:700; } .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.choice { text-align:left; font-size:18px; background:#fff6de; border:1px solid #c0a46f; }
details { margin-top:12px; border-top:1px solid var(--line); padding-top:6px; } summary { min-height:44px; padding:8px 0; font-weight:650; }
.hint, .record { border-left:3px solid #cdb071; padding:8px 12px; margin:7px 0; background:#f6f1e3; }
fieldset { border:1px solid var(--line); border-radius:7px; padding:8px 12px; margin-top:12px; }
.options label { display:inline-flex; align-items:center; min-height:44px; margin-right:16px; gap:6px; }
input { accent-color:var(--teal); } .entry { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:9px; margin:7px 0; }
.entry label { display:grid; gap:3px; font-size:14px; } .entry input { width:100%; min-height:44px; border:1px solid #a9af99; border-radius:5px; padding:6px; }
.mask { background:#e2d4b4; padding:12px; border-radius:6px; } .mask div { padding:3px 10px; background:#fffdf5; }
.mask .strip { background:repeating-linear-gradient(45deg,#dfd1af 0px,#dfd1af 8px,#e8ddbf 8px,#e8ddbf 10px); color:#514627; font-weight:650; }
.list { padding:0; list-style:none; } .list li { margin:8px 0; } .list strong { display:block; }
#message { color:#81461e; font-weight:650; } [hidden] { display:none!important; }
@media(max-width:400px){.choice-grid{grid-template-columns:1fr}.page{padding:15px}header small{font-size:12px}.entry{grid-template-columns:1.65fr 1fr}}
.mask-option { display:flex; gap:8px; align-items:center; min-height:44px; }
.time-machine { display:block; margin:0 auto 12px; }
</style></head>

<script type="application/json" id="manuscript">{"stages":[[{"role":"어른","story":true,"text":"타임머신이 다시 애굽 땅에 내렸어요.","note":"칸 1~2에서는 성경을 펴지 않는다. 44장은 칸 4에서 처음 편다"},{"role":"최온","story":false,"text":"지난번 단서를 다시 읽어 보자.","note":""},{"role":"어른","story":false,"text":"지난 일지에서 다음 탐험의 단서를 읽어 봐요.","note":"E57 일지의 '요셉의 집에서 먹고 마심 · 베냐민의 몫: 다섯 배', 43:34. 지난 일지가 없으면 \"요셉의 형들은 막내 베냐민과 함께 두 번째로 애굽에 갔어요. 형들은 그 나라의 총리가 요셉인 줄 몰랐어요. 형들은 요셉의 집에서 음식을 먹었어요.\"라고 말로 알려 주고 다음 쉼은 건너뛴다. 근거는 43:15, 42:6, 8, 43:32–34다"},{"role":"쉼","story":false,"text":"아이가 단서를 읽을 때까지 기다린다.","note":""}],[{"role":"어른","story":false,"text":"형들이 떠나기 전에 요셉은 청지기에게 어떤 일을 시켰어요. 무슨 일인지는 조금 뒤에 44장에서 찾아요.","note":"44:1. 시킨 일이 무엇인지는 여기서 말하지 않는다"},{"role":"어른","story":false,"text":"형들은 아침에 길을 떠났어요. 그런데 요셉의 청지기가 뒤따라왔어요.","note":"44:3–6"},{"role":"어른","story":false,"text":"청지기는 요셉의 은잔이 나오는 사람은 종이 되고 나머지는 죄가 없다고 말했어요.","note":"44:10. 청지기의 말이다. 자루를 살피기 전에 한 말이다. '은잔'은 2절과 12절의 낱말이다"},{"role":"어른","story":false,"text":"청지기가 자루를 살피자 베냐민의 자루에서 잔이 나왔어요. 잔이 어떻게 거기 들어갔는지는 요셉이 시킨 일을 읽으면 알게 돼요.","note":"44:11–12. 아이가 '훔쳤어요?'라고 묻거나 걱정하면 '어른이 고를 수 있는 도움말'의 말을 쓴다"},{"role":"어른","story":false,"text":"이번에도 성경을 펴기 전에 먼저 골라요. 고른 다음에 44장에서 확인해요.","note":"칸 3을 다녀온 아이에게는 이 줄 대신 \"이번에는 성경을 덮은 채로 다시 골라요.\"라고 말한다. 같은 카드를 또 고르면 '그 절은 몇 장에 있었나요?'라고만 묻고 다시 고르게 한다. 탐험이 처음인 아이에게는 '이번에도'를 빼고 읽는다"},{"role":"어른","story":true,"text":"잔이 나온 바로 다음에 형들은 어디로 갔을까요? 요셉이 있는 성일까요, 아버지가 있는 가나안 땅일까요?","note":""}],[{"role":"어른","story":true,"text":"타임머신이 다른 때에 잠깐 내렸어요.","note":""},{"role":"최온","story":false,"text":"여기는 언제일까?","note":""},{"role":"어른","story":false,"text":"창을 낸 종이 사이로 보이는 절을 봐요. 형들은 어느 땅에 돌아와 누구에게 이르렀나요?","note":"42:29. 가나안 땅, 아버지 야곱. 어른이 42장을 펴서 창을 낸 종이를 얹어 29절만 보이게 하고, 맞은쪽은 다른 종이로 다 덮는다"},{"role":"쉼","story":false,"text":"아이가 가나안 땅의 아버지 야곱이라고 말할 때까지 기다린다.","note":""},{"role":"어른","story":false,"text":"이 절은 창세기 몇 장에 있나요?","note":"42장. 어른이 장 번호를 손가락으로 짚어 보여 준다. 창을 낸 종이에 가려 장 번호가 보이지 않으면 종이의 귀퉁이만 잠깐 들어 장 번호만 보여 주고 다시 덮는다"},{"role":"쉼","story":false,"text":"아이가 42장이라고 말할 때까지 기다린다.","note":""},{"role":"어른","story":false,"text":"잔이 나온 일은 창세기 몇 장에서 확인하기로 했나요?","note":""},{"role":"쉼","story":false,"text":"아이가 44장이라고 말할 때까지 기다린다.","note":"칸 2에서 '고른 다음에 44장에서 확인해요'라고 했다. 42장의 이 절은 형들이 처음 애굽에 다녀온 때의 일이고, 오늘 찾는 것은 44장에서 잔이 나온 바로 다음의 일이다. 아이가 스스로 말하게 둔다. E56 일지가 있으면 '세 자리 · 창세기 42장'을 함께 본다"},{"role":"어른","story":true,"text":"일지에 찾은 것을 적어 둬요.","note":"'42장에서 형들이 돌아간 곳 · 창세기 42장 29절 · 가나안 땅, 아버지 야곱'"},{"role":"어른","story":true,"text":"성경을 덮어요. 애굽 땅으로 돌아가서 다시 골라 봐요.","note":""}],[{"role":"어른","story":true,"text":"이제 창세기 44장을 봐요. 형들이 떠나기 전의 일부터 읽어요.","note":"가림 종이를 미리 끼워 둔 44장을 어른이 편다. 44:18부터 45장까지와 14절 위의 소제목이 덮여 있어야 한다"},{"role":"어른","story":false,"text":"첫 절에서, 청지기에게 일을 시킨 사람이 누구인지 찾아봐요.","note":"1절. 요셉"},{"role":"쉼","story":false,"text":"아이가 '요셉'을 찾을 때까지 기다린다.","note":""},{"role":"어른","story":false,"text":"요셉은 자루마다 양식을 채우고 저마다의 돈도 넣으라고 했어요.","note":"1절. 요셉의 말이다"},{"role":"어른","story":false,"text":"요셉이 '내 잔'이라고 한 것이 어떤 잔인지 그다음 절에서 찾아봐요. 요셉은 그것을 그 청년의 자루에 넣으라고 했어요.","note":"2절. 은잔. 요셉의 말이다. '그 청년'은 베냐민이다. 2절에는 양식 값으로 낸 돈도 함께 넣으라는 말이 있다"},{"role":"쉼","story":false,"text":"아이가 '은잔'을 찾을 때까지 기다린다.","note":""},{"role":"어른","story":false,"text":"청지기는 요셉이 시킨 대로 했어요. 아침이 되자 형들은 길을 떠났어요.","note":"2절 끝, 3절–4절 앞. 서술자가 적은 일이다. 3절은 사람들과 나귀들을 보냈다고 적고, 4절 앞은 그들이 성을 나갔다고 적는다"},{"role":"어른","story":true,"text":"표의 첫 줄을 펴고 세 가지를 적어요.","note":"㉮ 시킨 사람 요셉(1절), 시킨 대로 한 사람 청지기(2절 끝), 넣으라고 한 것 은잔(2절). 적을 때마다 어른이 절 번호를 불러 주고 아이가 작은 칸에 적는다"}],[{"role":"어른","story":false,"text":"형들이 성을 나서서 아직 멀리 가지 못했을 때였어요. 요셉은 청지기에게 뒤따라가서 할 말을 일러 주었어요.","note":"4절 앞"},{"role":"어른","story":false,"text":"왜 잘해 준 일을 나쁜 일로 갚느냐고 말하라는 것이었어요.","note":"4절 뒤. 요셉이 일러 준 말이다. 5절의 말은 옮기지 않는다"},{"role":"어른","story":false,"text":"청지기는 형들에게 가서 그대로 말했어요.","note":"6절"},{"role":"어른","story":false,"text":"형들은 그런 일을 하지 않았다고 말했어요. 지난번 자루에서 나온 돈도 도로 가져왔다고 했어요.","note":"7–8절. 형들의 말이다"},{"role":"어른","story":false,"text":"청지기는 잔이 나오는 사람은 종이 되고 나머지는 죄가 없다고 말했어요.","note":"10절. 청지기의 말이다. 아직 자루를 살피기 전이다. 9절의 형들의 말은 옮기지 않는다"}],[{"role":"어른","story":false,"text":"형들은 서둘러 저마다 자루를 내려서 풀었어요. 청지기는 맏이의 자루부터 막내의 자루까지 차례로 살폈어요.","note":"11–12절 앞"},{"role":"어른","story":false,"text":"잔이 누구의 자루에서 나왔는지 그 절의 끝에서 찾아봐요.","note":"12절 끝. 베냐민. 어른이 12절을 짚어 준다"},{"role":"쉼","story":false,"text":"아이가 '베냐민'을 찾을 때까지 기다린다.","note":""},{"role":"어른","story":true,"text":"표의 둘째 줄을 펴고 자루의 임자를 적어요.","note":"㉯ 베냐민. 12절"},{"role":"어른","story":true,"text":"표의 첫 줄을 다시 읽어 봐요. 잔을 넣으라고 시킨 사람은 누구이고, 시킨 대로 한 사람은 누구인가요?","note":""},{"role":"쉼","story":false,"text":"아이가 요셉과 청지기라고 말할 때까지 기다린다.","note":"표 ㉮. 44:1–2. 아이가 '베냐민이 넣은 게 아니네요'라고 말하면 \"네, 성경에 그렇게 적혀 있어요.\"라고 받아 준다. 요셉이 한 일을 옳다 그르다 말하지 않는다"},{"role":"어른","story":false,"text":"형들이 그다음에 어디로 갔는지 바로 뒤에서 찾아봐요.","note":"13절. 성으로 돌아갔다. 13절 앞의 옷을 찢는 일은 어른 줄에 옮기지 않는다"},{"role":"쉼","story":false,"text":"아이가 '성으로 돌아갔다'를 찾을 때까지 기다린다.","note":""},{"role":"어른","story":true,"text":"표의 둘째 줄에 형들이 간 곳도 적어요.","note":"㉯ 성. 13절"}],[{"role":"어른","story":false,"text":"형들이 누구의 집에 이르렀는지 그다음 절에서 찾아봐요.","note":"14절. 요셉. 그 절은 요셉이 아직 거기 있었다고 적는다. 14절 위의 소제목은 덮여 있다"},{"role":"쉼","story":false,"text":"아이가 '요셉'을 찾을 때까지 기다린다.","note":""},{"role":"어른","story":true,"text":"아까 고른 카드와 견주어 봐요.","note":"13절의 '성', 14절의 '요셉의 집'"},{"role":"어른","story":false,"text":"유다와 형제들은 요셉 앞에 엎드렸어요. 요셉은 왜 이런 일을 했느냐고 물었어요.","note":"14절 끝, 15절 앞. 물은 것은 요셉의 말이다. 15절 뒤의 말은 옮기지 않는다"},{"role":"어른","story":false,"text":"유다는 무슨 말을 하겠느냐고 했어요. 그리고 형제들이 다 종이 되겠다고 말했어요.","note":"16절. 유다의 말이다. 가운데의 말은 옮기지 않는다. 물으면 '아이가 물을 때의 답'을 쓴다"},{"role":"어른","story":false,"text":"요셉은 그렇게 하지 않겠다고 했어요. 잔이 나온 사람만 종이 되라고 했어요.","note":"17절 앞. 요셉의 말이다"},{"role":"어른","story":false,"text":"요셉이 나머지 형들에게는 누구에게 돌아가라고 하는지 그 절의 끝에서 찾아봐요.","note":"17절 끝. 아버지"},{"role":"쉼","story":false,"text":"아이가 '아버지'를 찾을 때까지 기다린다.","note":""}],[{"role":"어른","story":true,"text":"표를 한 번 더 읽어 봐요. 잔을 넣으라고 시킨 사람과 잔이 나온 자루의 임자는 같은 사람인가요, 다른 사람인가요?","note":""},{"role":"쉼","story":false,"text":"아이가 다르다고 말할 때까지 기다린다.","note":""},{"role":"최온","story":false,"text":"잔을 넣으라고 시킨 사람은 요셉이고, 시킨 대로 한 사람은 청지기야. 베냐민이 넣은 것이 아니었어.","note":""},{"role":"어른","story":true,"text":"다음 탐험에서는 유다가 요셉에게 하는 말을 들어요.","note":""}],[{"role":"어른","story":true,"text":"일지에 표의 두 줄을 옮겨 적어요. 다음 탐험의 단서도 같이 적어요.","note":""}]],"choices":[{"label":"아버지가 있는 가나안 땅","to":3},{"label":"요셉이 있는 성","to":4}],"journal":[{"detour":false,"title":"잔을 넣으라고 시킨 사람","text":"창세기 44장 1–2절 · 요셉 · 시킨 대로 한 사람: 청지기 · 넣으라고 한 것: 은잔"},{"detour":false,"title":"잔이 나온 자루","text":"창세기 44장 12–13절 · 임자: 베냐민 · 형들이 간 곳: 성"},{"detour":false,"title":"다음 탐험의 단서","text":"창세기 44장 17절 · 요셉이 한 말: 잔이 나온 사람만 종이 되고 나머지는 아버지에게 돌아가라"},{"detour":true,"title":"42장에서 형들이 돌아간 곳","text":"창세기 42장 29절 · 가나안 땅, 아버지 야곱"}],"help":[["시작하기 전","어른이 원고를 먼저 끝까지 읽는다. 이 회에는 하지 않은 일로 도둑으로 몰리는 일(44:4–12), 한 사람만 종으로 남으라는 말(44:10, 17)이 있다. 아이가 눈으로 읽는 절에는 죽는다는 말(9절), 옷을 찢는 일(13절), '점'(5, 15절)도 있다. 억울하게 혼난 일이 있는 아이, 가족이 갇혀 있는 아이라면 미루는 쪽을 먼저 생각한다. 교사는 아이의 형편을 아이에게 묻지 말고 보호자에게 미리 확인한다","본문 밖 (진행 안내)"],["아이가 칸 2에서 '베냐민이 훔쳤어요?'라고 묻는다","\"요셉이 청지기에게 시킨 일을 읽으면 알게 돼요. 고른 다음에 44장의 첫머리에서 함께 읽어요.\"라고 답하고, 고르기를 마친 뒤 칸 4에서 읽는다. 아이가 거듭 묻거나 걱정하면 기다리게 하지 않는다. \"베냐민이 넣은 것이 아니에요. 요셉이 청지기에게 넣으라고 시켰다고 성경에 적혀 있어요.\"라고 먼저 말해 준다","창 44:1–2"],["'나도 안 했는데 혼났어요'","놀이를 멈추고 들어 준다. \"속상했겠어요. 그 이야기를 더 들려줘요.\" 캐묻지 않는다. 원고로 서둘러 돌아가지 않는다. 맞거나 괴롭힘을 당한 일을 말하면 E50의 '아이가 자기가 겪은 일(맞음, 따돌림, 형제의 괴롭힘)을 꺼낸다' 줄대로 한다","본문 밖 (감수 필수)"],["'베냐민은 종이 돼요? 못 돌아가요?'","\"44장의 여기까지는 요셉이 그렇게 말한 데서 멈춰요. 다음 탐험에서 유다가 요셉에게 하는 말이 이어져요.\" 아이가 걱정을 놓지 못하면 \"성경을 더 읽으면 베냐민은 종이 되지 않아요. 어떻게 되는지는 뒤의 탐험에서 함께 읽어요.\"라고 말해 준다(잠정. '정할 것'에 올렸다)","창 44:17–18, 45:14, 22"],["'우리 아빠도 못 돌아와요?' (가족이 갇혀 있는 아이)","놀이를 멈춘다. \"아빠가 보고 싶군요. 그 이야기를 더 들려줘요.\"라고 말하고 들어 준다. 돌아온다고도, 돌아오지 않는다고도 말하지 않는다. 원고로 서둘러 돌아가지 않는다. 문장은 감수에서 정한다","본문 밖의 보호 말 (감수 필수. 대표 확인)"],["아이가 놀라거나 굳거나 운다","어느 칸에서든 그 자리에서 멈춘다. \"오늘은 여기까지 해요. 지금 여기는 안전해요.\"라고 말한다. 칸 2~5에서 멈출 때는 \"베냐민이 넣은 것이 아니에요. 요셉이 청지기에게 넣으라고 시켰다고 성경에 적혀 있어요.\"를 먼저 말해 주고 멈춘다. 일지에는 그때까지 적은 줄만 둔다","본문 밖 (진행 안내), 창 44:1–2"]],"questions":[["(1–2절) 요셉은 왜 잔을 넣으라고 했어요? 형들을 속인 거예요?","\"성경은 요셉이 그렇게 시켰다고 적고, 까닭은 풀어 주지 않아요. 옳은지 그른지도 따로 적지 않아요. 목사님께 함께 여쭤봐요.\"","창 44:1–2"],["(1절) '청지기'가 뭐예요?","\"집의 일을 맡아보는 사람이에요.\"","창 44:1 (낱말 풀이는 본문 밖)"],["(1절) 돈은 왜 또 넣었어요?","\"성경은 요셉이 그렇게 시켰다고 적고, 까닭은 적지 않아요.\"","창 44:1"],["(2절) '그 청년'은 누구예요? '자루 아귀'가 뭐예요?","\"베냐민이에요. 12절에 그 잔이 나온 자루가 베냐민의 것이라고 적혀 있어요. 자루 아귀는 자루의 주둥이예요.\"","창 44:2, 12 (낱말 풀이는 본문 밖)"],["(2, 12절) 청지기는 자기가 넣고 왜 찾아요?","\"요셉이 뒤따라가서 그렇게 말하라고 일러 주었다고 성경은 적어요. 청지기의 마음은 적지 않아요.\"","창 44:4–6"],["(4절) '선을 악으로 갚는다'가 뭐예요?","\"요셉이 청지기에게 전하라고 한 말이에요. 잘해 주었는데 나쁜 일로 돌려준다는 뜻이에요.\"","창 44:4 (풀이는 본문 밖)"],["(5, 15절) '점친다'가 뭐예요? 요셉은 정말 점을 쳤어요?","\"점은 숨은 일이나 앞날을 알아내려고 하는 일을 가리키는 말이에요. 이 말은 요셉이 청지기에게 전하게 한 말과, 요셉이 형들에게 한 말에 나와요. 성경은 요셉이 점을 쳤다고 따로 적지 않아요. 더 깊은 것은 목사님께 함께 여쭤봐요.\"","창 44:5, 15 (낱말 풀이는 본문 밖. 문장은 감수에서 정한다)"],["(7–8절) 형들은 정말 훔치지 않았어요?","\"네. 1–2절은 요셉이 청지기에게 잔을 넣으라고 시켰고 청지기가 그대로 했다고 적어요.\"","창 44:1–2, 7–8"],["(7, 9, 16절) 형들은 왜 자기를 '당신의 종들', 그 사람을 '내 주'라고 해요?","\"형들과 유다가 높은 사람 앞에서 자기를 낮추어 한 말이에요. 9절과 16절의 끝에서 '종이 되겠다'고 한 것은 그 집에 매여 일하는 사람이 되겠다는 말이에요.\"","창 44:7, 9, 16 (낱말 풀이는 본문 밖)"],["(8절) '도둑질'이 뭐예요?","\"남의 것을 몰래 가져가는 일이에요. 형들은 그런 일을 어찌 하겠느냐고 말했어요.\"","창 44:8 (낱말 풀이는 본문 밖)"],["(9절) 형들은 왜 '죽을 것'이라고 했어요?","\"형들이 한 말이에요. 바로 앞에서 형들은 그런 일을 결코 하지 않는다고 말했어요. 왜 그렇게까지 말했는지는 적혀 있지 않아요. 청지기는 잔이 나오는 사람은 종이 된다고 말했어요.\"","창 44:7–10"],["베냐민은 죽어요?","\"아니에요. 청지기도 요셉도 종이 된다고만 말했어요.\"","창 44:10, 17"],["(10절) '죄가 없으리라'가 뭐예요?","\"청지기가 한 말이에요. 잔이 나오는 사람은 종이 되고 나머지는 책임이 없다는 말이에요.\"","창 44:10 (풀이는 본문 밖)"],["(12절) 왜 나이 많은 사람부터 살폈어요?","\"성경은 그 차례로 살폈다고 적고, 까닭은 적지 않아요.\"","창 44:12"],["(13절) 형들은 왜 옷을 찢었어요?","\"성경은 형들이 옷을 찢었다고 적어요. 그때 사람들이 몹시 슬프거나 괴로울 때 하던 일이에요.\"","창 44:13 (풀이는 본문 밖. 문장은 감수에서 정한다)"],["(13절) 형들은 왜 베냐민만 두고 가지 않았어요?","\"성경은 까닭을 적지 않아요. 형들이 다 같이 성으로 돌아갔다고 적어요.\"","창 44:13–14"],["(14절) 왜 유다의 이름을 따로 적어요?","\"성경이 그렇게 적어요. 까닭은 풀어 적지 않아요. 다음 탐험에서 유다가 요셉에게 말해요.\"","창 44:14, 18"],["(15절) 요셉은 자기가 시켜 놓고 왜 그렇게 물었어요?","\"성경은 요셉이 그렇게 말했다고 적고, 까닭은 풀어 주지 않아요. 목사님께 함께 여쭤봐요.\"","창 44:15"],["(16절) 유다는 왜 '하나님이 죄악을 찾아내셨다'고 했어요? 무슨 죄예요?","\"유다가 한 말이에요. 무엇을 두고 한 말인지는 유다가 풀어 말하지 않아요. 더 깊은 뜻은 목사님께 함께 여쭤봐요.\"","창 44:16"],["(16절) 유다는 왜 훔치지 않았다고 말하지 않았어요?","\"유다는 자기들이 바르다는 것을 어떻게 보이겠느냐고 말했어요. 왜 그렇게 말했는지는 적혀 있지 않아요.\"","창 44:16"],["(16절) '노예'가 뭐예요? 종과 달라요?","\"남에게 매여 시키는 대로 일해야 하는 사람이에요. 여기서는 앞의 '종'과 같은 뜻으로 쓰였어요.\"","창 44:16 (낱말 풀이는 본문 밖)"],["(17절) 요셉은 정말 베냐민을 종으로 삼으려 했어요?","\"요셉이 그렇게 말했다고 성경은 적어요. 요셉의 마음은 여기에 적혀 있지 않아요.\"","창 44:17"],["요셉은 언제 자기가 요셉이라고 말해요?","\"44장의 여기까지는 말하지 않아요. 뒤의 탐험에서 이어져요.\"","본문에 없음"],["(다른 장면) 그때는 왜 시므온을 두고 돌아갔어요?","\"42장에서 요셉은 시므온을 묶어 남기고, 나머지는 곡식을 가지고 돌아가서 막내 아우를 데려오라고 했어요.\" (E56을 건너뛴 아이에게는 '묶어'를 빼고 답한다)","창 42:19–20, 24"]],"decisions":[["1. 고르기","잔이 나온 바로 다음에 형들이 간 곳: 요셉이 있는 성(44:13–14) / 아버지가 있는 가나안 땅(42:29). 낱말 카드다. E57의 답(요셉의 집)과 같은 곳이고, 다른 장면도 두 회 이어 42장이다","총괄이 정한다. 지금대로를 추천한다. 형들이 베냐민을 두고 가지 않은 것이 13절에서 드러나는 물음이다. 별도 검증도 다른 보기를 찾아보았으나 더 나은 것을 찾지 못했다"],["2. 요셉이 잔을 넣게 한 일을 평가 없이 옮긴 것, '속인 거예요?'와 15절 물음의 답","성경이 까닭도 옳고 그름도 적지 않는다고 답하고 목사님께 넘긴다","목회자 확인(3.5)"],["3. 44:5, 15의 '점'과 44:16 가운데(하나님이 죄악을 찾아내셨다)","어른 줄에 넣지 않고 물을 때의 답에만 두었다. 아이는 눈으로 읽을 수 있다. '점'의 낱말 뜻은 한 문장을 잠정으로 적었다","목회자가 정한다. 16절 가운데는 지금대로(답에만)를 추천한다. 베냐민이 넣은 것이 아님을 막 확인한 아이가 '죄악'을 잔의 일로 듣기 쉽다. 다만 이 대목에서 하나님이 불리는 한 곳이라, 넣기로 하면 '유다는 하나님이 자기들의 잘못을 찾아내셨다고 말했어요' 같은 한 줄을 칸 7에 넣는다(문장은 감수에서 정한다)"],["4. 덮을 절이 있는지","44:1–17에는 덮지 않았다(9절의 죽는다는 말, 13절의 옷을 찢는 일, 5절과 15절의 '점', 16절 가운데). 14절 위의 소제목만 띠 종이로 덮는다","9절은 띠 종이로 덮는 쪽을 추천한다. E56이 42:37–38을, E50이 37:29–35를 덮은 것과 맞추는 것이다. 덮기로 하면 9절 답 줄을 '띠 종이 아래' 줄로 바꾼다. 나머지는 지금대로 두고 답 문장으로 받는다"],["5. 칸 2의 차례","요셉이 청지기에게 일을 시켰다는 것(44:1)을 먼저 말하고 잔이 나온 일을 말한 뒤, 칸 4에서 44:1–2를 읽는다. 걱정하는 아이에게는 어른이 '베냐민이 넣은 것이 아니에요'를 먼저 말해 준다","지금대로를 추천한다. 본문의 차례이고, 성경을 펴기 전에 고르는 규칙(4.1)도 지킨다. 44:1–3을 먼저 펴서 읽고 4절부터 덮은 채 고르는 길도 있다(가림 종이가 한 장 더 든다)"],["6. 걱정하는 아이에게 뒤의 일을 먼저 알려 줄지","'베냐민은 종이 돼요?'에 먼저 '다음 탐험에서 이어져요'라고 답하고, 걱정을 놓지 못하면 '성경을 더 읽으면 베냐민은 종이 되지 않아요'라고 말해 준다","지금대로를 추천한다. E56의 '시므온은 죽어요?' 답과 같은 처리다. 다음 회의 답(유다가 대신 남겠다고 함)은 새지 않는다"],["7. 고르기 카드를 낱말 카드로 둔 것","8~10세의 그림 고르기(규칙서 5절)와 다르다. 성경 속 사람을 그리지 않으려는 것이다","총괄이 정한다"]],"fallback":"요셉의 형들은 막내 베냐민과 함께 두 번째로 애굽에 갔어요. 형들은 그 나라의 총리가 요셉인 줄 몰랐어요. 형들은 요셉의 집에서 음식을 먹었어요.","retry":"이번에는 성경을 덮은 채로 다시 골라요.","retryPrompt":"그 절은 몇 장에 있었나요?","prayer":"하나님, 오늘 찾은 말씀을 잘 기억하게 해 주세요.","stopNote":"어느 칸에서든 그 자리에서 멈춘다. \"오늘은 여기까지 해요. 지금 여기는 안전해요.\"라고 말한다. 칸 2~5에서 멈출 때는 \"베냐민이 넣은 것이 아니에요. 요셉이 청지기에게 넣으라고 시켰다고 성경에 적혀 있어요.\"를 먼저 말해 주고 멈춘다. 일지에는 그때까지 적은 줄만 둔다"}</script>
<script>(() => {
  'use strict';
  const book = JSON.parse(document.querySelector('#manuscript').textContent);
  const app = document.querySelector('#app');
  const key = 'onyou.genesis.E58.rehearsal.v1';
  const fields = ['잔을 넣으라고 시킨 사람', '시킨 대로 한 사람', '넣으라고 한 것 · 은(　)', '잔이 나온 자루의 임자', '형들이 간 곳'];
  const fresh = () => ({ mode:'start', stage:1, line:0, prior:false, detour:false, entries:Array(10).fill('') });
  function restore() {
    const empty = fresh();
    try {
      const s = JSON.parse(localStorage.getItem(key));
      if (!s || !['start','play','pause','done'].includes(s.mode) || !Number.isInteger(s.stage) || !book.stages[s.stage-1] ||
          !Number.isInteger(s.line) || !book.stages[s.stage-1][s.line] || (s.mode === 'done' && s.stage !== 9)) return empty;
      return { mode:s.mode, stage:s.stage, line:s.line, prior:s.prior === true, detour:s.detour === true,
        entries:empty.entries.map((_, i) => typeof s.entries?.[i] === 'string' ? s.entries[i].slice(0,60) : '') };
    } catch { return empty; }
  }
  let state = restore();
  function save() { try { localStorage.setItem(key, JSON.stringify(state)); } catch { /* In-memory play remains available. */ } }
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(text, action, fn, cls) {
    const node = el('button', text, cls);
    node.type = 'button'; node.dataset.action = action; node.addEventListener('click', fn);
    return node;
  }
  function panel(title) {
    const box = el('details');
    box.append(el('summary',title));
    return box;
  }
  function helpTable(title, rows) {
    const box = panel(title);
    for (const [label, answer, ref] of rows) {
      const item = panel(label);
      item.append(el('p',answer),el('small',ref));
      box.append(item);
    }
    return box;
  }
  function reviewNotes() {
    const box = panel('대표와 목회자가 정할 것 · 7건');
    for (const [issue, current, recommendation] of book.decisions) {
      const item = panel(issue);
      item.append(el('h3','현재 원고'),el('p',current),el('h3','검토 의견'),el('p',recommendation));
      box.append(item);
    }
    return box;
  }
  function switchMode(mode) { state.mode = mode; save(); render(); }
  function go(stage, line = 0) { state.stage = stage; state.line = line; save(); render(); }
  function fieldCount() {
    if ((state.stage === 4 && state.line === book.stages[3].length - 1) || state.stage === 5) return 3;
    if (state.stage === 6) {
      if (state.line < 3) return 3;
      return state.line === book.stages[5].length - 1 ? 5 : 4;
    }
    return state.stage > 6 ? 5 : 0;
  }
  function notebook(count) {
    const section = el('fieldset', '', 'notebook');
    section.append(el('legend','잔의 표'));
    fields.slice(0, count).forEach((name, i) => {
      const row = el('div','','entry');
      [name, '절 번호'].forEach((title, j) => {
        const label = el('label', title);
        const input = el('input');
        const index = i * 2 + j;
        input.maxLength = 60;
        input.value = state.entries[index]; input.dataset.entry = String(index);
        if (j) input.setAttribute('aria-label',name + ' · 절 번호');
        input.addEventListener('input', () => { state.entries[index] = input.value; save(); });
        label.append(input); row.append(label);
      });
      section.append(row);
    });
    return section;
  }
  function recordList() {
    const list = el('ul','','list');
    for (const entry of book.journal.filter(e => !e.detour || state.detour)) {
      const li = el('li','','record');
      li.append(el('strong',entry.title),el('span',entry.text));
      list.append(li);
    }
    return list;
  }
  function maskGuide() {
    const box = panel('어른용 · 실물 성경 가림 위치');
    const diagram = el('div','','mask');
    const blocks = state.stage === 3
      ? [['앞뒤 절과 맞은쪽 덮기',true],['창을 낸 종이 · 창세기 42장 29절',false]]
      : [['창세기 44장 1~13절',false],['14절 위 소제목 · 띠 종이로 덮기',true],
        ['14~17절',false],['18절부터 45장까지 · 가림 종이로 덮기',true]];
    blocks.forEach(([text, covered]) => diagram.append(el('div',text,covered ? 'strip' : '')));
    box.append(diagram,el('small','절 번호로 본 배치 예시입니다. 사용하시는 성경의 단과 쪽에서 종이 위치를 확인하세요.'));
    if (state.stage !== 3) {
      const label = el('label','','mask-option');
      const check = el('input'); check.type='checkbox';
      label.append(check, '검토안 비교 · 9절도 띠 종이로 덮기');
      const first = diagram.firstChild;
      const nine = el('div','9절 · 띠 종이','strip');
      const rest = el('div','10~13절');
      check.addEventListener('change', () => {
        if (check.checked) {
          first.textContent = '창세기 44장 1~8절'; first.after(nine,rest);
        } else {
          first.textContent = '창세기 44장 1~13절'; nine.remove(); rest.remove();
        }
      });
      box.append(label);
    }
    return box;
  }
  function advance() {
    const {stage, line} = state;
    if (stage === 1 && !state.prior && line === 2) return go(2);
    if (line + 1 < book.stages[stage-1].length) return go(stage, line + 1);
    if (stage === 9) return switchMode('done');
    if (stage === 3) { state.detour = true; return go(2); }
    go(stage + 1);
  }
  function start(page) {
    page.append(document.querySelector('#cover').content.cloneNode(true),el('p','창세기 44장 1~17절','stage'),el('h1','E58 · 잔의 표'));
    page.append(el('p','원고의 두 경로를 어른이 직접 따라가는 검토본입니다. 쉼에서는 다음 줄을 누를 때까지 기다립니다.'));
    const options = el('fieldset','','options');
    options.append(el('legend','지난 탐험 일지'));
    for (const [value, label] of [[false,'E57 일지 없음'],[true,'E57 일지 있음']]) {
      const choice = el('label');
      const input = el('input'); input.type='radio'; input.name='prior'; input.checked = state.prior === value;
      input.addEventListener('change', () => { state.prior=value; save(); });
      choice.append(input, label); options.append(choice);
    }
    page.append(options,helpTable('시작 전 어른 도움말',book.help),reviewNotes());
    const actions = el('div','','actions');
    actions.append(button('검토 시작','start',() => switchMode('play'),'primary')); page.append(actions);
  }
  function play(page) {
    const {stage, line} = state;
    const script = book.stages[stage-1];
    const current = script[line];
    const head = el('div','','progress-label');
    head.append(el('b','칸 ' + stage + ' / 9'),el('span',(line + 1) + ' / ' + script.length + '줄'));
    const meter = el('progress'); meter.max = script.length; meter.value = line + 1; meter.setAttribute('aria-label','현재 칸 읽기');
    const label = current.story ? current.role + ' · 탐험대 이야기' : current.role;
    let speech = current.text;
    if (current.role === '쉼') speech = '찾거나 대답할 때까지 기다려요.';
    if (stage === 1 && line === 2 && !state.prior) speech = book.fallback;
    if (stage === 2 && line === 4) {
      if (state.detour) speech = book.retry;
      else if (!state.prior) speech = speech.replace(/^이번에도 /,'');
    }
    page.append(head,meter);
    if (stage === 1 || stage === 3) page.append(document.querySelector('#time-machine').content.cloneNode(true));
    page.append(el('p',label,'role'),el('h1',speech,'line'));
    if (stage === 3 && line === script.length - 2) page.append(el('p',book.journal.find(e => e.detour).text,'record'));
    if (stage === 7 && line === 2) page.append(el('p','고른 카드 · ' + book.choices.find(c => c.to === 4).label,'record'));
    const count = fieldCount();
    if (count) {
      const writing = stage === 4 || stage === 6 && (line === 3 || line === script.length - 1) || stage === 8 && line === 0 || stage === 9;
      if (writing) page.append(notebook(count));
      else {
        const box = panel('작성 중인 잔의 표');
        box.append(notebook(count)); page.append(box);
      }
    }
    if (stage === 9) page.append(recordList());
    const actions = el('div','','actions');
    if (line > 0) actions.append(button('이전 줄','back',() => go(stage,line - 1)));
    if (stage === 2 && line === script.length - 1) {
      const grid = el('div','','choice-grid');
      const status = el('p'); status.id='message'; status.setAttribute('role','status');
      for (const option of book.choices) grid.append(button(option.label,'choice-' + option.to,() => {
        if (state.detour && option.to === 3) { status.textContent=book.retryPrompt; return; }
        go(option.to);
      },'choice'));
      page.append(grid,status);
    } else {
      const text = stage === 9 ? '일지 마치기' : current.role === '쉼' ? '기다렸어요 · 계속' : '다음';
      actions.append(button(text,'advance',advance,'primary'));
    }
    page.append(actions);
    if (stage === 3 || stage >= 4 && stage <= 7) page.append(maskGuide());
    const guide = panel('어른용 · 읽기 도움말');
    if (current.role === '쉼') guide.append(el('p',current.text,'hint'));
    if (current.note) guide.append(el('p',current.note,'hint'));
    guide.append(helpTable('진행을 멈추거나 걱정할 때',book.help),helpTable('아이가 물을 때',book.questions));
    page.append(guide,button('잠시 멈추기','pause',() => switchMode('pause')));
  }
  function render(focus = true) {
    const page = el('section','','page');
    page.dataset.mode = state.mode; page.dataset.stage = state.stage; page.dataset.line = state.line;
    if (state.mode === 'start') start(page);
    if (state.mode === 'play') play(page);
    if (state.mode === 'pause') {
      page.append(el('h1','잠시 멈췄어요'),el('p','칸 ' + state.stage + '에서 이어갈 수 있습니다.'));
      if (state.stage >= 2 && state.stage <= 5) page.append(el('h3','어른용 · 멈출 때'),el('p',book.stopNote,'hint'));
      const actions = el('div','','actions');
      actions.append(button('이어서 검토','resume',() => switchMode('play'),'primary')); page.append(actions);
    }
    if (state.mode === 'done') {
      page.append(el('p','E58 · 창세기 44장','stage'),el('h1','완성한 탐험 일지'),notebook(5),el('h3','원고와 대조하기'),recordList());
      const prayer = panel('원하면 · 한 문장 기도'); prayer.append(el('p',book.prayer));
      page.append(prayer,reviewNotes(),button('새 검토 시작','restart',() => { state = fresh(); switchMode('start'); }));
    }
    app.replaceChildren(page);
    const heading = page.querySelector('h1');
    heading.tabIndex = -1;
    if (focus) { heading.focus({preventScroll:true}); window.scrollTo(0,0); }
  }
  render(false);
})();
</script></body></html>

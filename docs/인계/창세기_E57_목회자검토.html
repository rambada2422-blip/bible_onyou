<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>창세기 본편 · 목회자 검토</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f7f4ed;color:#282e2a;font:16px/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:56rem;margin:auto;padding:clamp(16px,4vw,44px)}
h1,h2,h3,p,ol{margin:0} h1,h2{font-family:Georgia,"Noto Serif KR",serif;letter-spacing:-.045em;line-height:1.3}
header{padding:12px 0 24px;border-bottom:2px solid #284e40} h1{font-size:clamp(28px,5vw,42px)}
header p, section>p{margin-top:8px;color:#454f49} section{margin-top:28px}
h2{font-size:24px} h3{font-size:17px;color:#27483a}
fieldset,article,.route{background:#fffdf8;border:1px solid #c5cbbe;border-radius:9px;padding:14px 18px}
fieldset{margin:14px 0 8px} legend{font-weight:650;padding:0 5px}
.options,.columns{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
label{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer} input{width:18px;height:18px;accent-color:#2c5847;flex:none}
input:focus-visible{outline:3px solid #a55318;outline-offset:3px}
.route{border-left:4px solid #315d4a} .route p{font-size:14px;color:#546259}
ol{display:flex;list-style:none;flex-wrap:wrap;gap:4px 8px;padding:4px 0 0;font-weight:700}
li:not(:last-child)::after{content:' →';color:#7c867e}
article{margin:10px 0} .source{font-size:14px;color:#5b645d}
.columns{margin-top:12px} .columns>div{border-top:1px solid #c5cbbe;padding-top:8px}.columns span{color:#505c54;font-size:13px;font-weight:750}
.columns .proposed{border-color:#4f795c} .proposed span{color:#30593c}
@media(max-width:600px){.columns,.options{grid-template-columns:1fr}.columns{gap:10px}fieldset,article,.route{padding:12px}}
@media print{body{background:white}main{max-width:none;padding:0}article,.route,fieldset{break-inside:avoid}}
</style>
</head>
<body><main>
<header><h1>창세기 본편 · 목회자 검토</h1><p>E51~E57 인계에서 넘어온 연령별 진행 방식과 문구 다섯 건을 검토합니다. 실제 원고 반영은 최종 목회자 검토 후 대표가 결정합니다.</p></header>
<section aria-labelledby="route-title"><h2 id="route-title">8~10세 진행 순서</h2>
<p>대표가 정한 기본값은 네 회를 건너뛰는 것입니다. 감수 후 보호자가 특정 회를 고르는 경우를 아래에서 확인할 수 있습니다.</p>
<fieldset><legend>보호자가 고른 회</legend><div class="options" id="options"></div></fieldset>
<div class="route"><p>E45~E53 구간 미리보기</p><div aria-live="polite" aria-atomic="true"><ol id="route" aria-label="진행 순서"></ol></div></div>
</section>
<section aria-labelledby="text-title"><h2 id="text-title">문구 대조</h2>
<p>회차표 네 행과 G06 한 문장입니다. G06은 아이에게 들리는 진행 대사와 녹음 대본을 함께 대조합니다.</p><div id="proposals"></div>
</section></main>
<script id="reading-order">/* 8~10세 진행 순서. 입력은 감수가 끝나 이용할 수 있는 회차 번호의 목록이다. */
(function () {
  'use strict';
  const guardianOnly = Object.freeze([46, 50, 51, 52]);

  function readingOrder(reviewedEpisodes, guardianChoices = []) {
    const selected = new Set(guardianChoices);
    return reviewedEpisodes.filter(number => !guardianOnly.includes(number) || selected.has(number));
  }

  const policy = Object.freeze({ guardianOnly, readingOrder });
  if (typeof module === 'object' && module.exports) module.exports = policy;
  else window.genesisYoungReaders = policy;
})();
</script>
<script type="application/json" id="source">{"sample":[{"number":45,"title":"달려와 야곱을 맞은 에서","ref":"창 33:1–20"},{"number":46,"title":"세겜에서 디나와 가족에게 일어난 일","ref":"창 34:1–31"},{"number":47,"title":"다시 벧엘로, 베냐민의 탄생과 가족의 이별","ref":"창 35:1–29"},{"number":48,"title":"세일에 자리 잡은 에서의 자손","ref":"창 36:1–43"},{"number":49,"title":"열일곱 살 요셉의 옷과 두 꿈","ref":"창 37:1–11"},{"number":50,"title":"돌아오지 않은 요셉과 아버지에게 간 옷","ref":"창 37:12–36"},{"number":51,"title":"유다와 다말, 주인을 밝힌 물건","ref":"창 38:1–30"},{"number":52,"title":"보디발의 집에서 감옥으로","ref":"창 39:1–23"},{"number":53,"title":"두 관원의 꿈과 잊힌 부탁","ref":"창 40:1–23"}],"proposals":[{"title":"E51 · 유다와 다말, 주인을 밝힌 물건","source":"회차표 51행","ref":"창 38:11, 14, 25–26","before":"유다 집안에 지켜지지 않은 약속과 도장·끈·지팡이가 누구의 것인지 확인한다. 민감한 가족사는 연령별로 풀어 쓴다.","after":"유다가 기다리라고 한 말과 셀라가 자란 뒤의 일을 살펴보고, 도장·끈·지팡이가 누구의 것인지 확인한다. 민감한 가족사는 연령별로 풀어 쓴다."},{"title":"E54 · 두 해 뒤, 바로의 두 꿈","source":"회차표 54행","ref":"창 41:8–13","before":"술 맡은 관원장이 언제 요셉을 떠올렸는지 확인하고, 두 꿈에 담긴 풍년과 흉년을 잇는다.","after":"술 맡은 관원장이 언제 요셉의 일을 바로에게 말했는지 확인하고, 두 꿈에 담긴 풍년과 흉년을 잇는다."},{"title":"E56 · 곡식을 구하러 온 열 형제","source":"회차표 56행","ref":"창 42:3–4, 24","before":"누가 애굽에 왔고 누가 집에 남았는지, 돌아갈 때 누가 남겨졌는지 확인한다.","after":"누가 애굽에 왔고 누가 아버지 곁에 남았는지, 돌아갈 때 누가 남겨졌는지 확인한다."},{"title":"E57 · 베냐민을 데리고 다시 애굽으로","source":"회차표 57행","ref":"창 43:8–9, 15","before":"양식이 떨어진 집에서 유다가 한 약속을 읽고, 첫 여행과 달라진 일행을 찾는다.","after":"양식이 떨어진 집에서 유다가 아버지에게 한 말을 읽고, 첫 여행과 달라진 일행을 찾는다."},{"title":"G06 · 요셉의 나이","source":"칸 1 진행 대사 · 녹음 대본 1번","ref":"창 41:46 · E55 고르기","before":"요셉은 서른 살에 바로 왕을 섬기게 되었어요. 그 뒤 요셉은 애굽 온 땅을 두루 다녔어요.","after":"요셉은 바로 왕을 섬기게 되었어요. 그 뒤 요셉은 애굽 온 땅을 두루 다녔어요."}]}</script>
<script>
'use strict';
const { guardianOnly, readingOrder } = window.genesisYoungReaders;
const { sample, proposals } = JSON.parse(document.querySelector('#source').textContent);
const options = document.querySelector('#options');
const route = document.querySelector('#route');
function element(tag, value) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  return node;
}
for (const episode of sample.filter(e => guardianOnly.includes(e.number))) {
  const label = element('label');
  const checkbox = element('input');
  checkbox.type = 'checkbox';
  checkbox.value = String(episode.number);
  checkbox.autocomplete = 'off';
  checkbox.checked = false;
  label.append(checkbox, 'E' + episode.number + ' · ' + episode.title);
  options.append(label);
}
function drawRoute() {
  const selected = Array.from(options.querySelectorAll(':checked'), box => Number(box.value));
  const included = readingOrder(sample.map(e => e.number), selected);
  route.replaceChildren(...included.map(number => element('li', 'E' + number)));
}
options.addEventListener('change', drawRoute);
drawRoute();
for (const entry of proposals) {
  const article = element('article');
  const source = element('p', entry.source + ' · ' + entry.ref);
  source.className = 'source';
  const columns = element('div');
  columns.className = 'columns';
  for (const [label, text, style] of [['현재 문구',entry.before,'current'],['검토할 문구',entry.after,'proposed']]) {
    const cell = element('div');
    cell.className = style;
    cell.append(element('span', label), element('p', text));
    columns.append(cell);
  }
  article.append(element('h3', entry.title), source, columns);
  document.querySelector('#proposals').append(article);
}
</script>
</body></html>
